name: Release → Produção

# Única forma de levar uma versão para produção: publicar uma Release com tag vX.Y.Z, criada a
# partir da main. Merge na main NÃO publica. Pré-lançamentos (prerelease) são ignorados.
#
# O deploy é por PULL. O servidor (172.16.100.35) fica na rede interna e o GitHub não consegue
# entrar nele; então é o servidor que consulta a última Release a cada 5 minutos
# (portal-neoguard-release.timer, ver portal/deploy/README.md) e implanta a tag.
# Este workflow só CONFERE e TESTA a Release: ele não acessa o servidor nem publica nada.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir a tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o formato da tag (vX.Y.Z)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Tag inválida::A tag \"$TAG\" não segue o formato vX.Y.Z (exemplo: v1.0.0). Apague a Release e a tag e publique de novo com uma tag válida."
            exit 1
          fi
          echo "Tag válida: $TAG"

      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Produção só com código que já passou por PR: o commit da tag precisa estar na main.
      - name: Conferir que a tag aponta para um commit da main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag fora da main::A tag \"$TAG\" aponta para um commit que não está na main. Crie a Release a partir da main."
            exit 1
          fi
          echo "Commit $GITHUB_SHA está na main."

  # Toda a bateria do ci.yml (dados, unitários, E2E, backend, frontend, imagens Docker e fumaça).
  testar:
    name: Testar a Release
    needs: conferir
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  pronta:
    name: Release pronta para o servidor
    needs: [conferir, testar]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumo
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## Release pronta para o servidor"
            echo
            echo "- Versão: \`${TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "O servidor consulta as Releases a cada 5 minutos e **implanta a tag \`${TAG}\` em até 5 minutos**."
            echo
            echo "Para acompanhar, no servidor:"
            echo
            echo "- \`tail -f /opt/portal-neoguard/deploy.log\`"
            echo "- \`curl -fsS http://localhost:8090/api/saude\` (o campo \`versao\` mostra o commit em produção)"
            echo
            echo "> Este workflow não acessa o servidor: ele só conferiu e testou a Release."
          } >> "$GITHUB_STEP_SUMMARY"
